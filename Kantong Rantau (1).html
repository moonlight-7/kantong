<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: satu kolom ala aplikasi HP (maks 520px), navigasi bawah, kartu bergaya struk dengan garis titik-titik. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface2:#F4F6FB; --ink:#14213D; --muted:#5B6783; --line:#DAE0EC;
  --accent:#2B4ACB; --accent-ink:#FFFFFF; --accent-soft:#E3E9FC;
  --in:#14804A; --in-soft:#DDF3E6; --out:#C93C37; --out-soft:#FBE4E2; --warn:#8A5300; --warn-soft:#FBEBCB;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 10px 28px rgba(20,33,61,.07);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --surface:#141C30; --surface2:#1A2440; --ink:#E7ECF8; --muted:#98A5C3; --line:#27324F;
  --accent:#8EA2FF; --accent-ink:#0C1220; --accent-soft:#222E5A;
  --in:#4CC98A; --in-soft:#12301F; --out:#FF7B73; --out-soft:#3A1B1C; --warn:#F0B64A; --warn-soft:#35280C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#141C30; --surface2:#1A2440; --ink:#E7ECF8; --muted:#98A5C3; --line:#27324F;
  --accent:#8EA2FF; --accent-ink:#0C1220; --accent-soft:#222E5A;
  --in:#4CC98A; --in-soft:#12301F; --out:#FF7B73; --out-soft:#3A1B1C; --warn:#F0B64A; --warn-soft:#35280C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}

.ch{width:100%;height:auto;display:block;overflow:visible}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-top:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}

.msgs{display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:10px 13px;border-radius:16px;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.b.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.recap{margin-top:8px;display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}

.ri{display:flex;align-items:baseline;gap:6px}
.ri .tx-note{font-size:14px}

.tip{margin-top:8px;font-size:13.5px;color:var(--muted)}

.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:bl 1s infinite}

.composer input{flex:1;min-width:0}

.inbox{border:1.5px dashed var(--accent);border-radius:12px;padding:12px 14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:4px}
.inbox .code{font-family:var(--f-mono);font-size:28px;font-weight:500;letter-spacing:.2em}
.codein{font-family:var(--f-mono);font-size:26px;letter-spacing:.35em;text-align:center}

.scrim{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding-top:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;max-width:calc(100% - 32px);font-size:14px;font-weight:500;box-shadow:var(--shadow)}

.menu{list-style:none;margin:0;padding:0}
.menu button{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;background:none;border:0;border-bottom:1px dashed var(--line);text-align:left;cursor:pointer;padding:6px 0}
.menu li:last-child button{border-bottom:0}
.menu .t{flex:1;display:flex;flex-direction:column}

.goal{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.goal:last-child{border-bottom:0;padding-bottom:0}
.goal:first-child{padding-top:0}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

</style>

<script>
// <logic>
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const rp=n=>{const v=Math.round(Math.abs(n));return(n<0&&v>0?'-':'')+'Rp '+String(v).replace(/\B(?=(\d{3})+(?!\d))/g,'.')};
const short=n=>{const a=Math.abs(n);const s=a>=1e6?(a/1e6).toFixed(1).replace(/\.0$/,'').replace('.',',')+' jt':a>=1e3?Math.round(a/1e3)+' rb':String(Math.round(a));return(n<0?'-':'')+s};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function dayLabel(d,base){const diff=Math.round((d-base)/864e5);if(diff===0)return'Hari ini';if(diff===-1)return'Kemarin';return HR[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]}
function getRange(period,offset,ref){
  const base=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate());
  if(period==='day'){const d=addDays(base,offset);return{start:ymd(d),end:ymd(d),label:dayLabel(d,base),rel:offset===0?'':''}}
  if(period==='week'){const dow=(base.getDay()+6)%7;const s=addDays(base,-dow+offset*7);const e=addDays(s,6);
    return{start:ymd(s),end:ymd(e),label:s.getDate()+' '+BLN[s.getMonth()]+' – '+e.getDate()+' '+BLN[e.getMonth()],rel:offset===0?'Minggu ini':''}}
  const mo=new Date(base.getFullYear(),base.getMonth()+offset,1);const N=daysIn(mo.getFullYear(),mo.getMonth());
  return{start:ymd(mo),end:ymd(new Date(mo.getFullYear(),mo.getMonth(),N)),label:BULAN[mo.getMonth()]+' '+mo.getFullYear(),rel:offset===0?'Bulan ini':''}
}
function sumRange(tx,s,e){let i=0,o=0;for(const t of tx){if(t.date>=s&&t.date<=e){if(t.type==='in')i+=t.amount;else o+=t.amount}}return{in:i,out:o}}
function catBreakdown(tx,s,e){const m={};for(const t of tx){if(t.type==='out'&&t.date>=s&&t.date<=e)m[t.cat]=(m[t.cat]||0)+t.amount}
  return Object.keys(m).map(k=>({cat:k,v:m[k]})).sort((a,b)=>b.v-a.v)}
function monthSeries(tx,y,m,now){
  const N=daysIn(y,m);const cur=now.getFullYear()===y&&now.getMonth()===m;const K=cur?now.getDate():N;
  const delta=Array(N+2).fill(0);const pre=y+'-'+pad(m+1)+'-';
  for(const t of tx){if(t.date.startsWith(pre)){const d=+t.date.slice(8,10);delta[d]+=t.type==='in'?t.amount:-t.amount}}
  const bal=[];let c=0;for(let d=1;d<=K;d++){c+=delta[d];bal.push(c)}
  return{N,K,bal}
}
function monthSummary(tx,y,m,now){
  const N=daysIn(y,m);const s=y+'-'+pad(m+1)+'-01',e=y+'-'+pad(m+1)+'-'+pad(N);
  const r=sumRange(tx,s,e);const bal=r.in-r.out;const cur=now.getFullYear()===y&&now.getMonth()===m;
  const day=cur?now.getDate():N;const avg=day>0?r.out/day:0;const left=cur?N-day+1:0;
  const safe=cur&&left>0?Math.max(0,bal)/left:0;let runway='';
  if(cur){
    if(r.out===0)runway='Belum ada pengeluaran bulan ini.';
    else if(bal<=0)runway='Uang saku bulan ini sudah habis.';
    else{const cover=bal/avg;
      if(cover>=N-day)runway='Dengan laju sekarang, uang sakumu cukup sampai akhir bulan.';
      else runway='Dengan laju sekarang, uang sakumu habis sekitar tanggal '+(day+Math.floor(cover))+'.'}
  }
  return{N,inc:r.in,out:r.out,bal,day,avg,safe,left,runway,cur};
}
function budgetStatus(S,now){

const mkRe=s=>new RegExp('\\b(?:'+s+')\\b','i');
const INC_RE=/\b(gaji|dapat|dapet|terima|diterima|kiriman|beasiswa|freelance|honor|cashback|ditransfer|dikasih|thr|angpao|bonus|jualan|jual|untung)\b|dikirim(?:i|in)?\s+(?:ortu|ibu|bapak|mama|papa|bunda|ayah|orang tua)|transfer(?:an)?\s+(?:masuk|dari)/i;
const WORD_AMT={ceban:10000,goceng:5000,seceng:1000,gopek:500,sejuta:1000000,seribu:1000};
const CATS_OUT=[

  ['Kesehatan',mkRe('obat|dokter|apotek|vitamin|klinik|puskesmas|masker')],

const CATS_IN=[
  ['Kiriman Ortu',mkRe('ortu|orang tua|ibu|bapak|mama|papa|bunda|ayah|kiriman|uang saku')],
  ['Beasiswa',mkRe('beasiswa|kip')],

function pickCat(type,s){const L=type==='in'?CATS_IN:CATS_OUT;for(const c of L){if(c[1].test(s))return c[0]}return L[L.length-1][0]}
function toAmount(num,unit){
  const mult={rb:1e3,ribu:1e3,k:1e3,jt:1e6,juta:1e6}[unit]||1;let v;
  if(/^\d+[.,]\d{1,2}$/.test(num)&&mult>1)v=parseFloat(num.replace(',','.'));
  else if(/^\d{1,3}([.,]\d{3})+$/.test(num))v=parseInt(num.replace(/[.,]/g,''),10);
  else v=parseFloat(num.replace(',','.'));
  return Math.round(v*mult);
}
function findAmount(s){
  const re=/(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?(?![a-z])/gi;let m;const c=[];
  while((m=re.exec(s))){c.push({amount:toAmount(m[1],(m[2]||'').toLowerCase()),unit:!!m[2],idx:m.index,len:m[0].length})}
  let pick=c.find(x=>x.unit&&x.amount>0);
  if(!pick){const w=s.match(/\b(ceban|goceng|seceng|gopek|sejuta|seribu)\b/);if(w)return{amount:WORD_AMT[w[1]],idx:w.index,len:w[0].length}}
  if(!pick)pick=c.filter(x=>x.amount>=500).sort((a,b)=>b.amount-a.amount)[0];
  return pick||null;
}
function cleanNote(s){s=s.replace(/\b(?:rp|rupiah|sebesar|sebanyak|aku|saya|udah|sudah|barusan)\b\.?/g,' ').replace(/[^\p{L}\p{N}&\- ]/gu,' ').replace(/\s+/g,' ').trim();return s?s[0].toUpperCase()+s.slice(1):''}
function detectQuery(o){
  if(/\b(bantuan|help|cara pakai|bisa apa)\b/.test(o))return'help';
  if(/\b(sisa|saldo|tinggal berapa)\b/.test(o))return'remaining';
  if(/\b(anggaran|batas|jatah|budget)\b/.test(o))return'budget';
  if(/\b(berapa|total)\b/.test(o)&&/\b(habis|keluar|pengeluaran|boros|belanja|jajan)\b/.test(o))return/\bbulan\b/.test(o)?'spent:month':/\bminggu\b/.test(o)?'spent:week':'spent:day';
  return null;
}
function parseChat(text,now){
  const orig=String(text).toLowerCase();
  let t=' '+orig.replace(/[ \t]+/g,' ').trim()+' ';let off=0;
  t=t.replace(/\btadi\s+(?:pagi|siang|sore|malam)\b/g,' ');
  const nd=t.match(/\b(\d+)\s*hari\s+(?:yang\s+)?lalu\b/);
  if(/\bkemarin lusa\b/.test(t)){off=-2;t=t.replace(/\bkemarin lusa\b/g,' ')}
  else if(nd){off=-Math.min(60,+nd[1]);t=t.replace(/\b\d+\s*hari\s+(?:yang\s+)?lalu\b/g,' ')}
  else if(/\bkemarin\b/.test(t)){off=-1;t=t.replace(/\bkemarin\b/g,' ')}
  t=t.replace(/\b(?:hari ini|tadi|barusan)\b/g,' ');
  const date=ymd(addDays(now,off));
  const segs=t.split(/\s*(?:,\s+|;|\+|\n|\bdan\b|\blalu\b|\bterus\b)\s*/).map(s=>s.trim()).filter(Boolean);
  const items=[];let carry='';
  for(const seg of segs){
    const a=findAmount(seg);
    if(!a){carry+=(carry?' ':'')+seg;continue}
    const rest=carry+' '+seg.slice(0,a.idx)+' '+seg.slice(a.idx+a.len);carry='';
    const type=INC_RE.test(rest)?'in':'out';const cat=pickCat(type,rest);
    items.push({type,amount:a.amount,cat,note:cleanNote(rest)||cat,date});
  }
  return{items,query:items.length?null:detectQuery(orig)};
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedMonth(y,m,upTo,rnd,allowance,tx,pre){
  const R=(a,b)=>Math.round((a+rnd()*(b-a))/500)*500;
  const add=(day,type,amount,cat,note)=>tx.push({id:pre+tx.length,type,amount,cat,note,date:ymd(new Date(y,m,day)),src:'manual',demo:true});
  add(1,'in',Math.round(allowance*.9/1000)*1000,'Kiriman Ortu','Kiriman bulanan dari ortu');
  if(upTo>=8)add(8,'in',350000,'Kerja Sampingan','Desain poster HIMA');
  for(let d=1;d<=upTo;d++){
    if(rnd()<.6)add(d,'out',R(7000,13000),'Makan','Sarapan');
    add(d,'out',R(12000,22000),'Makan','Makan siang');
    if(rnd()<.75)add(d,'out',R(13000,25000),'Makan','Makan malam');
    if(rnd()<.45)add(d,'out',R(10000,22000),'Jajan & Kopi',rnd()<.5?'Kopi':'Boba');
    if(rnd()<.55)add(d,'out',R(6000,14000),'Transport',rnd()<.5?'Ojek ke kampus':'Parkir dan bensin');
  }
  const ex=[[3,50000,'Kos & Tagihan','Token listrik kos'],[5,55000,'Kos & Tagihan','Paket data'],[6,12000,'Kuliah','Fotokopi modul'],[12,35000,'Kos & Tagihan','Laundry'],[15,40000,'Hiburan','Nonton bareng teman'],[18,24000,'Kesehatan','Obat flu'],[20,68000,'Belanja','Sabun dan shampo']];
  for(const e of ex){if(e[0]<=upTo)add(e[0],'out',e[1],e[2],e[3])}
}
function seedTx(now,allowance){
  const rnd=mulberry32(2026);const tx=[];const pm=new Date(now.getFullYear(),now.getMonth()-1,1);
  seedMonth(pm.getFullYear(),pm.getMonth(),daysIn(pm.getFullYear(),pm.getMonth()),rnd,allowance,tx,'p');
  const prev=tx.slice();tx.length=0;
  seedMonth(now.getFullYear(),now.getMonth(),now.getDate(),rnd,allowance,tx,'c');
  return prev.concat(tx);
}

function buildPdf(items){
  const W=595,H=842,M=44;const pages=[[]];let y=H-M;
  for(const it of items){
    if(it.skip){y-=it.skip;continue}
    const lead=it.lead||(it.s||10)*1.5;
    if(y-lead<M){pages.push([]);y=H-M}
    y-=lead;const pg=pages[pages.length-1];
    if(it.rule)pg.push('0.5 w '+M+' '+(y+lead/2).toFixed(1)+' m '+(W-M)+' '+(y+lead/2).toFixed(1)+' l S');
    else pg.push('BT /'+it.f+' '+it.s+' Tf '+M+' '+y.toFixed(1)+' Td ('+pdfEsc(it.t)+') Tj ET');
  }
  const objs=[];objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>';
  const kids=[];
  pages.forEach((p,i)=>{const cid=6+i*2,pid=7+i*2;const st=p.join('\n');kids.push(pid+' 0 R');
    objs[cid]='<< /Length '+st.length+' >>\nstream\n'+st+'\nendstream';
    objs[pid]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents '+cid+' 0 R >>'});
  objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' >>';
  let out='%PDF-1.4\n';const offs=[];
  for(let i=1;i<objs.length;i++){offs[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}
  const xr=out.length;out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  return out;
}

    const lv=ser.bal[ser.bal.length-1];g+='<circle class="pt" cx="'+X(ser.K).toFixed(1)+'" cy="'+Y(lv).toFixed(1)+'" r="4.5"/>';
  }
  return'<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik sisa uang saku per hari dalam sebulan">'+g+'</svg>';
}
function barChart(bars,limit,showVals){
  const W=340,H=150,pl=6,pr=6,pt=16,pb=20;const max=Math.max.apply(null,bars.map(b=>b.v).concat([limit||0,1]))*1.12;
  const bw=(W-pl-pr)/bars.length,gap=Math.min(6,bw*.3);let s='';
  bars.forEach((b,i)=>{const h=(H-pt-pb)*b.v/max;const x=pl+i*bw+gap/2,y=H-pb-h;
    s+='<rect class="'+(b.v===0?'b-zero':b.over?'b-over':'b-ok')+'" x="'+x.toFixed(1)+'" y="'+(b.v===0?H-pb-1.5:y).toFixed(1)+'" width="'+Math.max(1,bw-gap).toFixed(1)+'" height="'+(b.v===0?1.5:Math.max(h,1.5)).toFixed(1)+'" rx="2"/>';
    if(b.l)s+='<text class="ct" x="'+(x+(bw-gap)/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+b.l+'</text>';
    if(showVals&&b.v>0)s+='<text class="ct" x="'+(x+(bw-gap)/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+short(b.v)+'</text>';
  });
  if(limit>0){const ly=H-pb-(H-pt-pb)*limit/max;s+='<line class="lim" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ly.toFixed(1)+'" y2="'+ly.toFixed(1)+'"/>'}
  return'<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik pengeluaran">'+s+'</svg>';
}

function chatReply(text){

    case'undo':{const m=S.chat.find(x=>x.id===id);if(m&&!m.undone){const ids=m.items.map(t=>t.id);S.tx=S.tx.filter(t=>ids.indexOf(t.id)<0);m.undone=true;persist();paintChat();toast('Transaksi dibatalkan.')}break}
    case'resend':if(UI.pending){UI.pending.code=genCode();UI.pending.tries=0;UI.pending.resendAt=Date.now()+30000;render();toast('Kode baru dikirim.')}break;
    case'autobudget':{const a=getMoney($('#b-allow'));const d=Math.max(1000,Math.round(a/30/1000)*1000);$('#b-day').value=fmtMoney(d);$('#b-week').value=fmtMoney(d*7);$('#b-month').value=fmtMoney(a);break}
    case'sd':UI.sd=v;UI.confirm=null;render();break;
    case'paid':{const d=S.debts.find(x=>x.id===id);if(d){d.paid=true;persist();render();toast('Ditandai lunas.')}break}
    case'delDebt':if(UI.confirm==='d:'+id){S.debts=S.debts.filter(x=>x.id!==id);UI.confirm=null;persist();render()}else confirmKey('d:'+id);break;
    case'delGoal':if(UI.confirm==='g:'+id){S.savings=S.savings.filter(x=>x.id!==id);UI.confirm=null;persist();render()}else confirmKey('g:'+id);break;
    case'pdf':savePdf();break;
    case'clearDemo':S.tx=S.tx.filter(t=>!t.demo);S.savings=S.savings.filter(t=>!t.demo);S.debts=S.debts.filter(t=>!t.demo);S.demo=false;persist();render();toast('Data contoh dihapus.');break;
    case'logout':S=null;session=null;UI.screen='login';UI.draft=null;render();window.scrollTo(0,0);break;
    case'delAcc':if(UI.confirm==='acc'){const u=loadUsers();delete u[session.id];saveUsers(u);S=null;session=null;UI.confirm=null;UI.screen='welcome';render()}else confirmKey('acc');break;
  }
}
async function onForm(name,f,e){
  const q=id=>f.querySelector(id);
  if(name==='register'){
    const user=q('#r-user').value.trim(),email=q('#r-email').value.trim(),pass=q('#r-pass').value,demo=q('#r-demo').checked,er=q('#r-err');
    UI.draft={user,email,demo};let m='';
    if(!/^[a-zA-Z0-9._]{3,20}$/.test(user))m='Nama pengguna harus 3–20 karakter: huruf, angka, titik, atau garis bawah.';
    else if(loadUsers()[user.toLowerCase()])m='Nama pengguna sudah dipakai.';
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))m='Format email belum benar.';
    else if(Object.values(loadUsers()).some(u=>u.email.toLowerCase()===email.toLowerCase()))m='Email ini sudah terdaftar.';
    else if(pass.length<8)m='Kata sandi minimal 8 karakter.';
    else if(!window.crypto||!crypto.subtle)m='Browser ini belum mendukung enkripsi. Buka lewat HTTPS atau browser terbaru.';
    if(m){er.textContent=m;return}
    UI.pending={user,email,pass,demo,code:genCode(),tries:0,resendAt:Date.now()+30000};UI.screen='verify';render();window.scrollTo(0,0);
  }else if(name==='setup'){
    const a=getMoney(q('#s-allow')),er=q('#s-err');
    if(a<100000){er.textContent='Isi uang saku minimal Rp 100.000.';return}
    setBusy('#s-go',true,'Mengenkripsi data...');
    try{await finalize(a,q('#s-inc').checked)}catch(x){console.error(x);er.textContent='Gagal menyiapkan akun. Coba lagi.';setBusy('#s-go',false,'Mulai pakai Kantong Rantau')}
  }else if(name==='login'){
    const u=q('#l-user').value.trim(),p=q('#l-pass').value,er=q('#l-err');
    if(!u||!p){er.textContent='Isi nama pengguna dan kata sandi.';return}
    UI.draft={login:u};setBusy('#l-go',true,'Membuka data...');
    try{await doLogin(u,p)}catch(x){er.textContent='Nama pengguna atau kata sandi salah.';setBusy('#l-go',false,'Masuk')}
  }else if(name==='addtx'){
    const amt=getMoney(q('#a-amt')),er=q('#a-err');if(amt<=0){er.textContent='Isi jumlahnya dulu.';return}
    const cat=q('#a-cat').value,type=UI.sheetType,before=levelsNow();
    S.tx.push({id:uid(),type,amount:amt,cat,note:q('#a-note').value.trim()||cat,date:q('#a-date').value||ymd(new Date()),src:'manual'});
    persist();UI.sheet=false;render();const na=type==='out'?newAlert(before):'';toast(na||'Tersimpan: '+rp(amt)+' ('+cat+').');
  }else if(name==='chat'){const i=q('#c-in');const t=i.value;i.value='';sendChat(t);i.focus()}
  else if(name==='budget'){
    const a=getMoney(q('#b-allow')),d=getMoney(q('#b-day')),w=getMoney(q('#b-week')),mo=getMoney(q('#b-month'));
    if(!a||!d||!w||!mo){toast('Semua batas harus diisi.');return}
    S.allowance=a;S.budgets={day:d,week:w,month:mo};S.warnAt=parseFloat(q('#b-warn').value);persist();render();toast('Anggaran disimpan.');
  }else if(name==='newgoal'){
    const n=q('#g-name').value.trim(),t=getMoney(q('#g-target')),s=getMoney(q('#g-saved')),er=q('#g-err');
    if(!n||t<=0){er.textContent='Isi nama dan target tabungan.';return}
    S.savings.push({id:uid(),name:n,target:t,saved:s});persist();render();toast('Target ditambahkan.');
  }else if(name==='saveop'){
    const g=S.savings.find(x=>x.id===f.dataset.id),amt=getMoney(f.querySelector('input')),op=e.submitter&&e.submitter.value;
    if(!g||amt<=0){toast('Isi jumlahnya dulu.');return}
    g.saved=Math.max(0,g.saved+(op==='out'?-amt:amt));persist();render();toast(op==='out'?'Penarikan dicatat.':'Setoran dicatat.');
  }else if(name==='newdebt'){
    const who=q('#d-who').value.trim(),amt=getMoney(q('#d-amt')),er=q('#d-err');
    if(!who||amt<=0){er.textContent='Isi nama dan jumlahnya.';return}
    S.debts.push({id:uid(),who,dir:q('#d-dir').value,amount:amt,due:q('#d-due').value||ymd(new Date()),note:q('#d-note').value.trim(),paid:false});persist();render();toast('Tersimpan.');
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();onForm(f.dataset.form,f,e)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.classList&&t.classList.contains('money')){const d=t.value.replace(/\D/g,'').slice(0,10);t.value=fmtMoney(parseInt(d,10)||0);if(t.id==='s-allow')updSuggest()}
  else if(t.id==='r-user')checkUser(t.value);
  else if(t.id==='r-pass')updPw(t.value);
  else if(t.id==='v-code'){t.value=t.value.replace(/\D/g,'').slice(0,6);if(t.value.length===6)doVerify(t.value)}
});
document.addEventListener('change',e=>{if(e.target.id==='rp-month'){UI.reportMonth=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet){UI.sheet=false;render()}});

UI.screen=Object.keys(loadUsers()).length?'login':'welcome';
render();
</script>

</body></html>
